name: Perform ONNX Runtime Execution Provider wheel, nuget, archive Release Testing

permissions:
  checks: write
  contents: read
  id-token: write

on:
  push:
    branches:
      - dev/qti-mbadnara/release-testing-workflow
  workflow_call:
    inputs: &common_inputs
      artifact_format:
        description: "The format of artifact. Choose one of [wheel, nuget, zip, tgz, all]."
        type: string
        default: "wheel"
      version_from:
        description: |
          Source version of artifact.
          For python wheel, the format should be <version>.<version>.<version><.><suffix>.
            And the suffix should be <letters><numbers>.
          For nuget package, the format should be <version>.<version>.<version>-<suffix>.
            Please note that underscore (_) is not allowed in the version format.
        type: string
        # default: "0.1.0.test0"
        default: "2.2.0"
      index_server_from:
        description: |
          From which server the artifact is located. Choose one of
          ["test-users", "test-project", "project", "public"].
        type: string
        # default: "test-users"
        default: "public"
  workflow_dispatch:
    inputs: *common_inputs

# Resolve inputs once at the workflow level. Push triggers don't supply inputs
# (and YAML `default:` values are not applied to push events), so each entry
# falls back to a sensible default when the dispatch/call value is empty.
env:
  ARTIFACT_FORMAT:   ${{ inputs.artifact_format   || 'wheel' }}
  VERSION_FROM:      ${{ inputs.version_from      || '2.2.0' }}
  INDEX_SERVER_FROM: ${{ inputs.index_server_from || 'public' }}

jobs:
  download-wheel-from-artifactory:
    name: "Download and Verify Wheels from Artifactory"
    runs-on: [Linux, self-hosted, Build]
    # if: inputs.artifact_format == 'wheel' || inputs.artifact_format == 'all'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      # ---------------------------------
      # Step 1: Download Wheels
      # ---------------------------------

      - name: Download Wheels from Artifactory
        env:
          ARTIFACTORY_BASE_URL: ${{ secrets.ARTIFACTORY_BASE_URL }}
          JFROG_API_KEY:        ${{ secrets.JFROG_API_KEY }}
        run: |
          python qcom/scripts/release_testing/download_artifacts.py \
            --artifact_folder_name      "${VERSION_FROM}" \
            --artifact_to_be_downloaded wheel \
            --index_server              "${INDEX_SERVER_FROM}" \
            --output_directory          "${{ github.workspace }}/release_testing/wheel"

      # ---------------------------------
      # Step 2: Verify Count of Wheels
      # ---------------------------------

      - name: Verify Count of Wheels
        run: |
          wheel_dir="${{ github.workspace }}/release_testing/wheel"
          win_arm64=$(find "$wheel_dir" -maxdepth 1 -name "*win_arm64.whl"              | wc -l)
          win_amd64=$(find "$wheel_dir" -maxdepth 1 -name "*win_amd64.whl"              | wc -l)
          manylinux=$(find "$wheel_dir" -maxdepth 1 -name "*manylinux_2_34_aarch64.whl" | wc -l)
          total=$(find "$wheel_dir" -maxdepth 1 -name "*.whl"                           | wc -l)
          other=$(( total - win_arm64 - win_amd64 - manylinux ))

          echo "win_arm64:                  $win_arm64"
          echo "win_amd64:                  $win_amd64"
          echo "manylinux_2_34_aarch64:     $manylinux"
          echo "other:                      $other"
          echo "total:                      $total"

          errors=0
          [ "$win_arm64" -eq 4 ] || { echo "ERROR: Expected 4 win_arm64 wheels, found $win_arm64";           errors=1; }
          [ "$win_amd64" -eq 4 ] || { echo "ERROR: Expected 4 win_amd64 wheels, found $win_amd64";           errors=1; }
          [ "$manylinux" -eq 4 ] || { echo "ERROR: Expected 4 manylinux_2_34_aarch64 wheels, found $manylinux"; errors=1; }
          if [ "$other" -gt 0 ]; then
            echo "ERROR: Found $other unexpected wheel(s):"
            find "$wheel_dir" -maxdepth 1 -name "*.whl" \
              ! -name "*win_arm64.whl" \
              ! -name "*win_amd64.whl" \
              ! -name "*manylinux_2_34_aarch64.whl"
            errors=1
          fi

          [ "$errors" -eq 0 ] || exit 1
          echo "Wheel count validation passed: 4 win_arm64, 4 win_amd64, 4 manylinux_2_34_aarch64"

      # ---------------------------------
      # Hand off wheels to Windows job
      # ---------------------------------

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: release-test-wheels-${{ github.run_id }}
          path: "${{ github.workspace }}/release_testing/wheel/*.whl"
          if-no-files-found: error

  verify-windows-wheel-metadata:
    name: "Verify Windows Wheel Metadata"
    runs-on: [Windows, self-hosted, Build]
    needs: [download-wheel-from-artifactory]
    # if: inputs.artifact_format == 'wheel' || inputs.artifact_format == 'all'

    steps:
      - uses: actions/checkout@v6

      - name: Download Wheels
        uses: actions/download-artifact@v4
        with:
          name: release-test-wheels-${{ github.run_id }}
          path: "${{ github.workspace }}/release_testing/wheel"

      # ---------------------------------
      # Step 3: Verify Windows Wheel Metadata
      # ---------------------------------

      - name: Verify Windows Wheel Metadata
        shell: pwsh
        run: |
          & "${{ github.workspace }}/qcom/scripts/release_testing/verify_windows_wheel_metadata.ps1" `
            -WheelDirectory "${{ github.workspace }}/release_testing/wheel" `
            -ExpectedVersion "$env:VERSION_FROM"

  test-wheel-on-windows:
    name: "Test Wheel - ${{ matrix.platform.name }} - Py${{ matrix.python-version }}"
    needs: [download-wheel-from-artifactory]
    runs-on: ${{ matrix.platform.os }}
    # if: inputs.artifact_format == 'wheel' || inputs.artifact_format == 'all'

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: "Windows ARM64"
            os: [Windows, self-hosted, ARM64]
            wheel_arch: win_arm64
          - name: "Windows x86_64"
            os: [Windows, self-hosted, x86_64]
            wheel_arch: win_amd64
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Download Wheels
        uses: actions/download-artifact@v4
        with:
          name: release-test-wheels-${{ github.run_id }}
          path: "${{ github.workspace }}/release_testing/wheel"

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ---------------------------------
      # Step 4 (Windows): Test Wheel
      # ---------------------------------

      - name: Test Wheel
        shell: pwsh
        run: |
          & "${{ github.workspace }}/qcom/scripts/release_testing/install_and_test_wheel.ps1" `
            -PythonVersion   "${{ matrix.python-version }}" `
            -WheelArch       "${{ matrix.platform.wheel_arch }}" `
            -WheelDirectory  "${{ github.workspace }}/release_testing/wheel" `
            -ExpectedVersion "$env:VERSION_FROM" `
            -SamplePath      "${{ github.workspace }}/qcom/samples/test_wheel.py"

  test-wheel-on-linux:
    name: "Test Wheel - Linux aarch64 - Py${{ matrix.python-version }}"
    needs: [download-wheel-from-artifactory]
    runs-on: [Linux, self-hosted, ARM64]
    container:
      image: quay.io/pypa/manylinux_2_34_aarch64
    # if: inputs.artifact_format == 'wheel' || inputs.artifact_format == 'all'

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Download Wheels
        uses: actions/download-artifact@v4
        with:
          name: release-test-wheels-${{ github.run_id }}
          path: "${{ github.workspace }}/release_testing/wheel"

      # ---------------------------------
      # Step 4 (Linux): Test Wheel
      # ---------------------------------

      - name: Test Wheel
        shell: bash
        run: |
          bash "${GITHUB_WORKSPACE}/qcom/scripts/release_testing/install_and_test_wheel.sh" \
            --python-version    "${{ matrix.python-version }}" \
            --wheel-arch        "manylinux_2_34_aarch64" \
            --wheel-directory   "${GITHUB_WORKSPACE}/release_testing/wheel" \
            --expected-version  "${VERSION_FROM}" \
            --sample-path       "${GITHUB_WORKSPACE}/qcom/samples/test_wheel.py"

  verify-backward-compatibility:
    name: "Verify Backward Compatibility (Windows ARM64, Py3.12)"
    runs-on: [Windows, self-hosted, ARM64]
    needs: [download-wheel-from-artifactory]
    # if: inputs.artifact_format == 'wheel' || inputs.artifact_format == 'all'

    steps:
      - uses: actions/checkout@v6

      - name: Download Wheels
        uses: actions/download-artifact@v4
        with:
          name: release-test-wheels-${{ github.run_id }}
          path: "${{ github.workspace }}/release_testing/wheel"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------------------------------
      # Step 5: Verify Backward Compatibility
      #   - Install onnxruntime-qnn from the cp312 win_arm64 wheel
      #   - Replace bundled onnxruntime with onnxruntime==1.24.2
      #   - Run the sample to confirm the EP still loads against the older runtime
      # ---------------------------------

      - name: Backward Compatibility Test
        shell: pwsh
        run: |
          & "${{ github.workspace }}/qcom/scripts/release_testing/verify_backward_compatibility.ps1" `
            -PythonVersion       "3.12" `
            -WheelArch           "win_arm64" `
            -WheelDirectory      "${{ github.workspace }}/release_testing/wheel" `
            -OnnxruntimeVersion  "1.24.2" `
            -SamplePath          "${{ github.workspace }}/qcom/samples/test_wheel.py"
